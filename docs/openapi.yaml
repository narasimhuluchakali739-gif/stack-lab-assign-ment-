openapi: 3.0.1
info:
  title: Stacklab Task Management API
  description: JWT-secured task, project, user, notification, and reporting API.
  version: 1.0.0
servers:
- url: http://localhost:8080
paths:
  /api/users/{id}:
    get:
      tags:
      - user-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserView'
      security:
      - bearerAuth: []
    put:
      tags:
      - user-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserView'
      security:
      - bearerAuth: []
    delete:
      tags:
      - user-controller
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
      security:
      - bearerAuth: []
  /api/tasks/{id}:
    get:
      tags:
      - task-controller
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaskView'
      security:
      - bearerAuth: []
    put:
      tags:
      - task-controller
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaskView'
      security:
      - bearerAuth: []
    delete:
      tags:
      - task-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
      security:
      - bearerAuth: []
  /api/projects/{id}:
    get:
      tags:
      - project-controller
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProjectView'
      security:
      - bearerAuth: []
    put:
      tags:
      - project-controller
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProjectView'
      security:
      - bearerAuth: []
  /api/users:
    get:
      tags:
      - user-controller
      operationId: list
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageUserView'
      security:
      - bearerAuth: []
    post:
      tags:
      - user-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserView'
      security:
      - bearerAuth: []
  /api/tasks:
    get:
      tags:
      - task-controller
      operationId: list_1
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - TO_DO
          - IN_PROGRESS
          - REVIEW
          - COMPLETED
      - name: priority
        in: query
        required: false
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      - name: assigneeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: overdue
        in: query
        required: false
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - createdAt,DESC
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageTaskView'
      security:
      - bearerAuth: []
    post:
      tags:
      - task-controller
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TaskView'
      security:
      - bearerAuth: []
  /api/projects:
    get:
      tags:
      - project-controller
      operationId: list_2
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - createdAt,DESC
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageProjectView'
      security:
      - bearerAuth: []
    post:
      tags:
      - project-controller
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProjectView'
      security:
      - bearerAuth: []
  /api/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/notifications/{id}/read:
    patch:
      tags:
      - notification-controller
      operationId: read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NotificationView'
      security:
      - bearerAuth: []
  /api/tasks/{id}/activity:
    get:
      tags:
      - task-controller
      operationId: history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityView'
      security:
      - bearerAuth: []
  /api/projects/{id}/activity:
    get:
      tags:
      - project-controller
      operationId: history_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityView'
      security:
      - bearerAuth: []
  /api/notifications:
    get:
      tags:
      - notification-controller
      operationId: list_3
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationView'
      security:
      - bearerAuth: []
  /api/analytics:
    get:
      tags:
      - analytics-controller
      operationId: overview
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
      security:
      - bearerAuth: []
  /api/analytics/employees/{id}/performance:
    get:
      tags:
      - analytics-controller
      operationId: performance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
      security:
      - bearerAuth: []
  /api/analytics/breakdown:
    get:
      tags:
      - analytics-controller
      operationId: breakdown
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
      security:
      - bearerAuth: []
components:
  schemas:
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - EMPLOYEE
        active:
          type: boolean
    UserView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - EMPLOYEE
        active:
          type: boolean
    TaskInput:
      required:
      - version
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        deadline:
          type: string
          format: date-time
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        status:
          type: string
          enum:
          - TO_DO
          - IN_PROGRESS
          - REVIEW
          - COMPLETED
        version:
          type: integer
          format: int64
    TaskView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: integer
          format: int64
        assignee:
          type: string
        projectId:
          type: integer
          format: int64
        deadline:
          type: string
          format: date-time
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        status:
          type: string
          enum:
          - TO_DO
          - IN_PROGRESS
          - REVIEW
          - COMPLETED
        version:
          type: integer
          format: int64
        completedAt:
          type: string
          format: date-time
        isOverdue:
          type: boolean
    ProjectInput:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        managerId:
          type: integer
          format: int64
        archived:
          type: boolean
    ProjectView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        managerId:
          type: integer
          format: int64
        managerName:
          type: string
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCreate:
      required:
      - email
      - name
      - password
      - role
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          maxLength: 2147483647
          minLength: 8
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - EMPLOYEE
    TaskCreate:
      required:
      - assigneeId
      - deadline
      - priority
      - projectId
      - title
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        assigneeId:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        deadline:
          type: string
          format: date-time
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        status:
          type: string
          enum:
          - TO_DO
          - IN_PROGRESS
          - REVIEW
          - COMPLETED
    RegisterRequest:
      required:
      - email
      - name
      - password
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 0
          type: string
        email:
          type: string
        password:
          maxLength: 100
          minLength: 8
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserView'
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    NotificationView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    PageUserView:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserView'
        number:
          type: integer
          format: int32
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortObject'
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
        paged:
          type: boolean
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
    SortObject:
      type: object
      properties:
        direction:
          type: string
        nullHandling:
          type: string
        ascending:
          type: boolean
        property:
          type: string
        ignoreCase:
          type: boolean
    PageTaskView:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskView'
        number:
          type: integer
          format: int32
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortObject'
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
    ActivityView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        actorId:
          type: integer
          format: int64
        action:
          type: string
        field:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        occurredAt:
          type: string
          format: date-time
    PageProjectView:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProjectView'
        number:
          type: integer
          format: int32
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortObject'
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
