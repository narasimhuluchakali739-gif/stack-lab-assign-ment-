spring:
  application:
    name: stacklab-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  error:
    include-message: never
  port: ${PORT:8080}
app:
  demo:
    seed-password: ${DEMO_SEED_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
